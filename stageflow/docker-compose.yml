services:
	api:
		build: .
		ports:
			- "8000:8000"
		env_file:
			- .env
		depends_on:
			postgres:
				condition: service_healthy

	postgres:
		image: postgres:16-alpine
		environment:
			POSTGRES_DB: stageflow
			POSTGRES_USER: postgres
			POSTGRES_PASSWORD: postgres
		ports:
			- "5432:5432"
		volumes:
			- stageflow_pgdata:/var/lib/postgresql/data
		healthcheck:
			test: ["CMD-SHELL", "pg_isready -U postgres -d stageflow"]
			interval: 5s
			timeout: 5s
			retries: 10

volumes:
	stageflow_pgdata:
